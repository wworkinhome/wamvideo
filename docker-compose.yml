services:
  postgres:
    image: postgres:16-alpine
    container_name: wamvideo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wamvideo
      POSTGRES_PASSWORD: wamvideo
      POSTGRES_DB: wamvideo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wamvideo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: wamvideo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wamvideo
      MINIO_ROOT_PASSWORD: wamvideo123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
